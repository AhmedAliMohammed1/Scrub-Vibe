name: Production smoke monitor

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Liveness
        run: curl --fail --silent --show-error --retry 3 --max-time 20 https://scrub-vibe-tau.vercel.app/api/health/live
      - name: Readiness
        run: curl --fail --silent --show-error --retry 3 --max-time 20 https://scrub-vibe-tau.vercel.app/api/health/ready
